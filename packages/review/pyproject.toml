[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review"
version = "0.1.0"
description = "Human-in-the-loop review: CandidateSet → em-v1 samples in a GlyphStore (Contract Y)."
requires-python = ">=3.12"
dependencies = [
    "hwfont-schema",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27", "font-gen"]

[project.scripts]
review = "review.run:main"

[tool.hatch.build.targets.wheel]
packages = ["src/review"]

[tool.hatch.build.targets.wheel.force-include]
"src/review/static" = "review/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
